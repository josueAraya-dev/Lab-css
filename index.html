<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo Grid y Flex</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>grid layout</h1>
    <div class="parent">
        <header class="A">A</header>
        <section class="B">B</section>
        <aside class="C">C</aside>
        <footer class="D">D</footer>
    </div>

    <h1>flex layout</h1>
    <div class="contenedor-flex">
        <div class="izquierda">
            <div class="caja item-a">A</div>
            <div class="fila-bc">
                <div class="caja item-b">B</div>
                <div class="caja item-c">C</div>
            </div>
        </div>
        <div class="caja item-d">D</div>
    </div>

</body>
</html>
